<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analytics - URL Shortener</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: radial-gradient(circle at top left, #0f172a 0, #020617 45%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.96);
            --card-border: rgba(148, 163, 184, 0.25);
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }

        .wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .topbar {
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .title {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .link {
            color: var(--primary);
            text-decoration: none;
        }

        .link:hover { text-decoration: underline; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.85);
            padding: 1.25rem;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.18);
            text-align: left;
            vertical-align: top;
            font-size: 0.92rem;
        }

        th {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            font-weight: 700;
        }

        .muted { color: var(--text-muted); }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="topbar">
        <h1 class="title">Analytics Dashboard</h1>
        <a class="link" href="/">Back to Shortener</a>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Short Code</th>
                <th>Short URL</th>
                <th>Original URL</th>
                <th>Clicks</th>
                <th>Created</th>
                <th>Last Visited</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(urls)}">
                <td colspan="6" class="muted">No URLs created yet.</td>
            </tr>
            <tr th:each="item : ${urls}">
                <td class="mono" th:text="${item.shortcode}"></td>
                <td class="mono">
                    <a class="link"
                       th:href="${baseUrl + '/' + item.shortcode}"
                       th:text="${baseUrl + '/' + item.shortcode}"></a>
                </td>
                <td>
                    <a class="link" th:href="${item.originalUrl}" th:text="${item.originalUrl}"></a>
                </td>
                <td th:text="${item.visitCount}"></td>
                <td th:text="${item.createdAt}"></td>
                <td th:text="${item.lastVisitedAt != null ? item.lastVisitedAt : '—'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
